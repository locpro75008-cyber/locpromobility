name: Weekly Rebuild — Publication articles programmés

on:
  schedule:
    # Chaque lundi à 6h00 UTC (8h00 Paris en été, 7h00 en hiver)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Permet aussi de déclencher manuellement depuis GitHub Actions

jobs:
  trigger-vercel-rebuild:
    name: Déclencher un rebuild Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Déclencher le Deploy Hook Vercel
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

      - name: Confirmer le déclenchement
        run: echo "✅ Rebuild Vercel déclenché le $(date '+%A %d %B %Y à %H:%M UTC')"

      # On attend 3 min que Vercel finisse le déploiement, puis on pinge les moteurs
      - name: Attendre la fin du déploiement Vercel
        run: sleep 180

      - name: Ping Google — soumettre le sitemap
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://locpromobility.fr/sitemap.xml" \
            -w "HTTP %{http_code}" -o /dev/null
          echo " ✅ Google pingé"

      - name: Ping Bing — soumettre le sitemap
        run: |
          curl -s "https://www.bing.com/ping?sitemap=https://locpromobility.fr/sitemap.xml" \
            -w "HTTP %{http_code}" -o /dev/null
          echo " ✅ Bing pingé"
