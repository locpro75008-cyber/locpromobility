name: Lighthouse CI — Rapport hebdomadaire de performance

on:
  schedule:
    # Chaque mardi à 7h00 UTC (lendemain du rebuild Vercel)
    - cron: '0 7 * * 2'
  workflow_dispatch:

jobs:
  lighthouse:
    name: Audit Lighthouse
    runs-on: ubuntu-latest

    steps:
      - name: Installer Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Auditer les pages principales
        run: |
          lhci collect \
            --url=https://locpromobility.fr \
            --url=https://locpromobility.fr/catalogue \
            --url=https://locpromobility.fr/blog \
            --url=https://locpromobility.fr/tarifs \
            --numberOfRuns=1 \
            --settings.output=json \
            --settings.chromeFlags="--no-sandbox --headless"
        continue-on-error: true

      - name: Afficher le résumé des scores
        run: |
          echo "=== RAPPORT LIGHTHOUSE ===" 
          echo "Date : $(date '+%A %d %B %Y')"
          echo ""
          if ls .lighthouseci/*.json 1> /dev/null 2>&1; then
            for f in .lighthouseci/*.json; do
              URL=$(cat "$f" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('finalUrl','?'))" 2>/dev/null || echo "?")
              PERF=$(cat "$f" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['categories']['performance']['score']*100))" 2>/dev/null || echo "?")
              SEO=$(cat "$f" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['categories']['seo']['score']*100))" 2>/dev/null || echo "?")
              ACCES=$(cat "$f" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['categories']['accessibility']['score']*100))" 2>/dev/null || echo "?")
              BP=$(cat "$f" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['categories']['best-practices']['score']*100))" 2>/dev/null || echo "?")
              echo "📄 $URL"
              echo "   Perf: $PERF | SEO: $SEO | Accessibilité: $ACCES | Best practices: $BP"
            done
          else
            echo "Aucun rapport généré."
          fi

      - name: Alerte si performance < 70 (échec CI = email GitHub)
        run: |
          ALERT=false
          if ls .lighthouseci/*.json 1> /dev/null 2>&1; then
            for f in .lighthouseci/*.json; do
              PERF=$(cat "$f" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['categories']['performance']['score']*100))" 2>/dev/null || echo "100")
              URL=$(cat "$f" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('finalUrl','?'))" 2>/dev/null || echo "?")
              if [ "$PERF" -lt 70 ]; then
                echo "::error::Performance $PERF% sur $URL (< 70%)"
                ALERT=true
              fi
            done
          fi
          if [ "$ALERT" = true ]; then
            echo "❌ Au moins une page est sous le seuil de 70% — vérifiez les optimisations."
            exit 1
          fi
          echo "✅ Tous les scores de performance sont satisfaisants."
